spring:
  application:
    name: api-gateway-service

server:
  port: 8079

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/user/**

            - id: match-service
              uri: http://localhost:8081
              predicates:
                -Path=/api/v1/match/**,/api/v1/swipe/**

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springdoc: DEBUG
    com.date.gateway: DEBUG




